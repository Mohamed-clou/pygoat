name: CI

on : [push]

jobs: 
  sast_scan: 
    name: Run Bandit Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code 
      uses: actions/chekout@v2

    - name: Set up python
      uses: actrion/setup-python@v2
      with:
        python-version: 3.8

    - name: Instsall Bandit
      run: pip install bandit

    - name: Run Bandit Scan
      run: bandit -r .
